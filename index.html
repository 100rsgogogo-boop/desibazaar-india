<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiBazaar India - Massive Mega Sale (20% OFF)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased selection:bg-orange-500 selection:text-white pb-16">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-xl sm:text-2xl font-black text-orange-600 tracking-wider cursor-pointer" onclick="switchView('store')">Desi<span class="text-green-600">Bazaar</span></span>
                <span class="bg-red-100 text-red-600 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide">Mega Sale 20% OFF</span>
            </div>
            <div class="flex items-center space-x-3 sm:space-x-6">
                <button onclick="switchView('store')" class="text-gray-700 hover:text-orange-600 font-medium text-xs sm:text-sm">Shop</button>
                <button onclick="openAdminLogin()" id="nav-admin-btn" class="text-gray-600 hover:text-orange-600 font-medium text-xs sm:text-sm">Admin</button>
                <button onclick="openCart()" class="relative bg-orange-50 text-orange-600 px-3 py-2 rounded-lg flex items-center space-x-1">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-orange-600 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <main id="main-container" class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-8">
        <div class="text-center py-20 text-gray-500">Loading Cloud Products...</div>
    </main>

    <!-- Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-black/50" onclick="closeCart()"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white shadow-xl flex flex-col">
                <div class="p-4 border-b flex items-center justify-between bg-gray-50">
                    <h3 class="font-bold text-gray-900">Your Cart</h3>
                    <button onclick="closeCart()"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <div id="cart-body" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
            </div>
        </div>
    </div>

    <!-- Admin Login -->
    <div id="admin-login-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
            <h3 class="text-lg font-bold mb-4">Admin Login</h3>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <input type="password" id="admin-pass" placeholder="Password (admin123)" required class="w-full border rounded-lg px-3 py-2 text-sm">
                <button type="submit" class="w-full bg-orange-600 text-white font-bold py-2.5 rounded-lg">Login</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://yaspybgbdumospscbpvu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_5LDw8SG9tSr9Awl9ToDKGg_hNZD_4in";
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let products = [];
        let orders = [];
        let cart = [];
        let currentPage = 1;
        const pageSize = 24;
        let isAdminLoggedIn = false;

        async function initCloudData() {
            try {
                const { data: prodData } = await db.from('products').select('*').limit(500);
                products = prodData || [];
                const { data: ordData } = await db.from('orders').select('*');
                orders = ordData || [];
            } catch (err) {
                console.error(err);
            }
            switchView('store');
        }

        function switchView(view) {
            const container = document.getElementById('main-container');
            if (view === 'store') renderStore(container);
            else if (view === 'admin') {
                if (!isAdminLoggedIn) { document.getElementById('admin-login-modal').classList.remove('hidden'); return; }
                renderAdmin(container);
            }
        }

        function renderStore(container) {
            const displayed = products.slice(0, currentPage * pageSize);
            container.innerHTML = `
                <div class="bg-gradient-to-r from-red-600 to-orange-600 rounded-2xl p-8 text-white mb-8 shadow">
                    <span class="bg-white/25 text-xs px-3 py-1 rounded-full font-bold">🔥 Massive Mega Sale • 20% OFF</span>
                    <h1 class="text-3xl sm:text-5xl font-extrabold mt-3 mb-2">Authentic Products at 80% of Market Price</h1>
                    <p class="text-orange-100 text-sm">Over 3,000+ verified Indian lifestyle products on discounted clearance.</p>
                </div>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    ${displayed.map(p => `
                        <div class="bg-white rounded-xl shadow-sm border p-3 flex flex-col justify-between relative">
                            <span class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">20% OFF</span>
                            <img src="${p.image}" class="h-36 w-full object-cover rounded-lg mb-2">
                            <div>
                                <span class="text-[10px] text-orange-600 font-bold uppercase">${p.category}</span>
                                <h3 class="font-bold text-gray-900 text-sm line-clamp-1">${p.name}</h3>
                                <div class="flex items-center space-x-2 mt-2">
                                    <span class="text-base font-extrabold text-red-600">₹${p.price}</span>
                                    <span class="text-xs text-gray-400 line-through">₹${Math.round(p.price / 0.8)}</span>
                                </div>
                            </div>
                            <button onclick="addToCart(${p.id})" class="w-full mt-3 bg-red-600 text-white py-2 rounded-lg text-xs font-bold hover:bg-red-700">Add to Cart</button>
                        </div>
                    `).join('')}
                </div>
                ${displayed.length < products.length ? `<div class="text-center mt-8"><button onclick="currentPage++; renderStore(document.getElementById('main-container'))" class="bg-gray-900 text-white px-6 py-3 rounded-xl font-bold">Load More</button></div>` : ''}
            `;
        }

        function addToCart(id) {
            const p = products.find(item => item.id === id);
            const item = cart.find(i => i.id === id);
            if (item) item.qty++;
            else cart.push({ ...p, qty: 1 });
            document.getElementById('cart-badge').innerText = cart.reduce((s, i) => s + i.qty, 0);
            openCart();
            renderCart();
        }

        function openCart() { document.getElementById('cart-drawer').classList.remove('hidden'); renderCart(); }
        function closeCart() { document.getElementById('cart-drawer').classList.add('hidden'); }

        function renderCart() {
            const body = document.getElementById('cart-body');
            const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            body.innerHTML = cart.length === 0 ? '<p class="text-center text-gray-400 py-10">Cart is empty</p>' : `
                ${cart.map(i => `<div class="flex justify-between items-center border-b pb-2"><div><h4 class="font-bold text-sm">${i.name}</h4><p class="text-xs text-red-600">₹${i.price} x${i.qty}</p></div></div>`).join('')}
                <div class="border-t pt-4 font-bold flex justify-between"><span>Total:</span><span>₹${subtotal}</span></div>
            `;
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            if (document.getElementById('admin-pass').value === 'admin123') {
                isAdminLoggedIn = true;
                document.getElementById('admin-login-modal').classList.add('hidden');
                switchView('admin');
            } else alert('Wrong password');
        }

        function renderAdmin(container) {
            container.innerHTML = `<h1 class="text-2xl font-bold mb-4">Admin Hub</h1><p>Loaded ${products.length} products from Supabase.</p>`;
        }

        initCloudData();
    </script>
</body>
</html>

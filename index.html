<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiBazaar India - Online Shopping Mega Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#f1f3f6] text-gray-800 font-sans antialiased pb-24">

    <!-- Flipkart 顶栏 -->
    <header class="bg-[#2874f0] text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="switchView('home')">
                <div class="flex flex-col">
                    <span class="text-2xl font-black italic tracking-wider leading-none text-white">Desi<span class="text-[#ffe11b]">Bazaar</span></span>
                    <span class="text-[10px] italic text-yellow-300 font-bold flex items-center">Explore <span class="text-white ml-0.5">Plus</span> <i class="fa-solid fa-plus text-[8px] text-yellow-300 ml-0.5"></i></span>
                </div>
            </div>

            <!-- 搜索框 -->
            <div class="flex-1 max-w-2xl mx-6 hidden md:flex items-center bg-white rounded-sm shadow-inner px-3 py-1.5">
                <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Search for products, brands and more" class="w-full text-sm text-gray-800 focus:outline-none bg-transparent">
                <i class="fa-solid fa-magnifying-glass text-[#2874f0] text-lg cursor-pointer"></i>
            </div>

            <!-- 右侧 -->
            <div class="flex items-center space-x-6">
                <button onclick="switchView('home')" class="hover:text-yellow-300 font-medium text-sm hidden sm:inline-block">Home</button>
                <button onclick="openCart()" class="bg-white text-[#2874f0] px-4 py-1.5 rounded-sm font-bold text-sm flex items-center space-x-2 shadow-sm hover:bg-gray-50 transition relative">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Cart</span>
                    <span id="cart-badge" class="bg-[#ff6161] text-white text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold absolute -top-2 -right-2">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 分类导航条 -->
    <nav class="bg-white shadow-sm border-b mb-6 hidden md:block">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center text-sm font-semibold text-gray-700 overflow-x-auto space-x-10">
            <button onclick="filterCategory('All')" class="hover:text-[#2874f0] text-[#2874f0] flex items-center space-x-1"><i class="fa-solid fa-fire text-orange-500"></i><span>All Products</span></button>
            <button onclick="filterCategory('Ethnic Wear')" class="hover:text-[#2874f0]">👗 Ethnic Wear & Sarees</button>
            <button onclick="filterCategory('Groceries & Spices')" class="hover:text-[#2874f0]">🌾 Spices & Groceries</button>
            <button onclick="filterCategory('Home & Kitchen')" class="hover:text-[#2874f0]">🪔 Home & Kitchen</button>
            <button onclick="filterCategory('Ayurvedic & Beauty')" class="hover:text-[#2874f0]">🌿 Ayurvedic & Beauty</button>
            <button onclick="filterCategory('Electronics')" class="hover:text-[#2874f0]">⚡ Electronics & Gadgets</button>
            <button onclick="filterCategory('Festive & Gifts')" class="hover:text-[#2874f0]">🎁 Festive Specials</button>
        </div>
    </nav>

    <!-- 主容器 -->
    <main id="app-main" class="max-w-7xl mx-auto px-2 sm:px-4">
        <!-- 动态渲染内容 -->
    </main>

    <!-- 购物车抽屉 -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-xs" onclick="closeCart()"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                <div class="p-4 border-b flex items-center justify-between bg-[#2874f0] text-white">
                    <h3 class="font-bold text-base"><i class="fa-solid fa-cart-shopping mr-2"></i>My Flipkart Cart</h3>
                    <button onclick="closeCart()" class="hover:text-yellow-300"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <div id="cart-body" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
            </div>
        </div>
    </div>

    <!-- 底部版权 -->
    <footer class="bg-[#172337] text-gray-300 mt-20 py-10 text-xs border-t border-gray-700">
        <div class="max-w-7xl mx-auto px-4 grid grid-cols-2 md:grid-cols-4 gap-8">
            <div>
                <h4 class="text-gray-500 font-bold uppercase mb-3 text-[11px]">ABOUT</h4>
                <ul class="space-y-2"><li><a href="#" class="hover:underline">Contact Us</a></li><li><a href="#" class="hover:underline">About Us</a></li></ul>
            </div>
            <div>
                <h4 class="text-gray-500 font-bold uppercase mb-3 text-[11px]">HELP</h4>
                <ul class="space-y-2"><li><a href="#" class="hover:underline">Flipkart Secure Payments</a></li><li><a href="#" class="hover:underline">Shipping</a></li></ul>
            </div>
            <div>
                <h4 class="text-gray-500 font-bold uppercase mb-3 text-[11px]">POLICY</h4>
                <ul class="space-y-2"><li><a href="#" class="hover:underline">Return Policy</a></li><li><a href="#" class="hover:underline">Terms Of Use</a></li></ul>
            </div>
            <div>
                <h4 class="text-gray-500 font-bold uppercase mb-3 text-[11px]">Registered Office</h4>
                <p class="text-gray-400 leading-relaxed">DesiBazaar India, Outer Ring Road, Bengaluru, 560103, Karnataka, India</p>
            </div>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = "https://yaspybgbdumospscbpvu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_5LDw8SG9tSr9Awl9ToDKGg_hNZD_4in";
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allProducts = [];
        let filteredProducts = [];
        let displayCount = 24;
        let cart = [];
        let currentView = 'home'; 
        let selectedProduct = null;
        let shippingInfo = {};

        // 卖家池（赋予每个商品不同的独立卖家）
        const sellersPool = [
            { name: "Royal Banarasi Weaves (Varanasi)", rating: "4.8 ★" },
            { name: "Kashmiri Saffron Artisans (Srinagar)", rating: "4.9 ★" },
            { name: "Jaipur Handicrafts Emporium", rating: "4.7 ★" },
            { name: "Mumbai Spice & Groceries Trading Co.", rating: "4.6 ★" },
            { name: "South India Silk House (Chennai)", rating: "4.8 ★" },
            { name: "Punjab Jutti & Footwear Hub", rating: "4.7 ★" },
            { name: "Delhi Electronics & Lifestyle", rating: "4.5 ★" },
            { name: "Kerala Ayurvedic Herbals Ltd.", rating: "4.9 ★" }
        ];

        async function init() {
            try {
                const { data, error } = await db.from('products').select('*').limit(3000);
                if (error) {
                    document.getElementById('app-main').innerHTML = `<div class="text-center py-20 text-red-600 font-bold bg-white rounded">Error: ${error.message}</div>`;
                    return;
                }
                allProducts = data || [];
                filteredProducts = allProducts;
                render();
            } catch (err) {
                console.error(err);
            }
        }

        function switchView(view, product = null) {
            currentView = view;
            if (product) selectedProduct = product;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
        }

        function render() {
            const main = document.getElementById('app-main');
            if (currentView === 'home') main.innerHTML = renderHomeHTML();
            else if (currentView === 'detail') main.innerHTML = renderDetailHTML();
            else if (currentView === 'checkout') main.innerHTML = renderCheckoutHTML();
            else if (currentView === 'payment') main.innerHTML = renderPaymentHTML();
            else if (currentView === 'success') main.innerHTML = renderSuccessHTML();
        }

        // --- 1. 首页渲染 ---
        function renderHomeHTML() {
            const items = filteredProducts.slice(0, displayCount);
            return `
                <div class="bg-gradient-to-r from-[#2874f0] via-indigo-600 to-[#1e5bb8] rounded-lg p-6 sm:p-8 text-white mb-6 shadow-md flex flex-col sm:flex-row justify-between items-center relative overflow-hidden">
                    <div class="z-10">
                        <span class="bg-[#ffe11b] text-blue-900 text-xs font-black px-3 py-1 rounded-sm uppercase">⚡ Big Billion Mega Sale</span>
                        <h1 class="text-2xl sm:text-4xl font-extrabold mt-2">Flat 20% OFF Across All Products</h1>
                        <p class="text-blue-100 text-sm mt-1">Over 3,000 unique items with dedicated Indian sellers & WhatsApp support.</p>
                    </div>
                    <div class="mt-4 sm:mt-0 bg-white/10 px-5 py-3 rounded-lg border border-white/20 text-center backdrop-blur-sm z-10">
                        <span class="block text-xs text-blue-200">Express Delivery</span>
                        <span class="font-black text-lg text-yellow-300">Pan-India Hub</span>
                    </div>
                </div>

                <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
                    ${items.map((p) => {
                        const seller = sellersPool[p.id % sellersPool.length];
                        const rating = (4.2 + ((p.id % 7) * 0.1)).toFixed(1);
                        return `
                            <div onclick='openProductDetail(${JSON.stringify(p).replace(/'/g, "&#39;")})' class="bg-white border border-gray-200 rounded-sm p-3 flex flex-col justify-between hover:shadow-xl transition group cursor-pointer relative">
                                <div>
                                    <div class="relative mb-3 overflow-hidden rounded-sm bg-gray-100 h-48">
                                        <span class="absolute top-2 left-2 bg-[#b12704] text-white text-[10px] font-black px-2 py-0.5 rounded-sm shadow">20% OFF</span>
                                        <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                    </div>
                                    <span class="text-[10px] text-gray-400 uppercase font-bold tracking-wide">${p.category || 'General'}</span>
                                    <h3 class="font-semibold text-gray-900 text-sm line-clamp-1 mt-0.5 group-hover:text-[#2874f0]">${p.name}</h3>
                                    
                                    <div class="flex items-center space-x-1.5 mt-1.5">
                                        <span class="bg-[#388e3c] text-white text-[10px] font-bold px-1.5 py-0.5 rounded-sm flex items-center">${rating} <i class="fa-solid fa-star text-[8px] ml-0.5"></i></span>
                                        <span class="text-xs text-gray-400">(${120 + (p.id * 13) % 700})</span>
                                    </div>

                                    <div class="flex items-baseline space-x-2 mt-2">
                                        <span class="text-base font-extrabold text-gray-900">₹${p.price}</span>
                                        <span class="text-xs text-gray-400 line-through">₹${Math.round(p.price / 0.8)}</span>
                                        <span class="text-xs text-[#388e3c] font-bold">20% off</span>
                                    </div>
                                    <p class="text-[10px] text-gray-500 mt-1 italic truncate">Seller: ${seller.name}</p>
                                </div>
                                <button onclick="event.stopPropagation(); addToCart(${p.id})" class="mt-3 bg-[#ff9f00] hover:bg-[#f39700] text-white text-xs font-bold py-2.5 rounded-sm shadow-xs uppercase tracking-wide transition flex items-center justify-center space-x-1">
                                    <i class="fa-solid fa-cart-shopping"></i><span>Add to Cart</span>
                                </button>
                            </div>
                        `;
                    }).join('')}
                </div>

                ${displayCount < filteredProducts.length ? `
                    <div class="text-center mt-10">
                        <button onclick="loadMore()" class="bg-[#2874f0] text-white px-10 py-3 rounded-sm shadow-md font-bold hover:bg-blue-700 transition uppercase text-sm">Load More Products</button>
                    </div>
                ` : ''}
            `;
        }

        // --- 2. 商品详情页 ---
        function openProductDetail(p) {
            switchView('detail', p);
        }

        function renderDetailHTML() {
            const p = selectedProduct;
            const seller = sellersPool[p.id % sellersPool.length];
            const whatsappNumber = "919876543210"; 
            const whatsappMessage = encodeURIComponent(`Hi, I am interested in buying [${p.name}] (Price: ₹${p.price}, ID: #${p.id}) from DesiBazaar. Please share more details.`);
            const whatsappLink = `https://wa.me/${whatsappNumber}?text=${whatsappMessage}`;

            return `
                <div class="bg-white rounded-lg shadow-sm border p-4 sm:p-8">
                    <button onclick="switchView('home')" class="mb-6 text-sm font-bold text-[#2874f0] hover:underline flex items-center space-x-1">
                        <i class="fa-solid fa-arrow-left"></i><span>Back to Products</span>
                    </button>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="bg-gray-100 rounded-lg overflow-hidden h-96 flex items-center justify-center relative">
                            <span class="absolute top-4 left-4 bg-red-600 text-white text-xs font-bold px-3 py-1 rounded">20% OFF Mega Sale</span>
                            <img src="${p.image}" class="w-full h-full object-cover">
                        </div>

                        <div class="flex flex-col justify-between">
                            <div>
                                <span class="text-xs text-blue-600 font-bold uppercase tracking-wide bg-blue-50 px-2 py-1 rounded">${p.category || 'General'}</span>
                                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 mt-2">${p.name}</h1>
                                
                                <div class="flex items-center space-x-2 mt-2">
                                    <span class="bg-[#388e3c] text-white text-xs font-bold px-2 py-0.5 rounded flex items-center">4.7 <i class="fa-solid fa-star text-[9px] ml-1"></i></span>
                                    <span class="text-sm text-gray-500">1,420 Ratings & 312 Reviews</span>
                                </div>

                                <div class="flex items-baseline space-x-3 mt-4">
                                    <span class="text-3xl font-extrabold text-gray-900">₹${p.price}</span>
                                    <span class="text-base text-gray-400 line-through">₹${Math.round(p.price / 0.8)}</span>
                                    <span class="text-sm text-[#388e3c] font-bold">20% Off Festive Discount</span>
                                </div>

                                <p class="text-gray-600 text-sm mt-4 leading-relaxed">${p.description}</p>

                                <!-- 卖家与 WhatsApp 客服 -->
                                <div class="mt-6 p-4 bg-blue-50 border border-blue-100 rounded-lg">
                                    <div class="flex justify-between items-center mb-2">
                                        <div>
                                            <span class="text-xs text-gray-500 block">Verified Seller:</span>
                                            <span class="font-bold text-gray-900 text-sm">${seller.name}</span>
                                        </div>
                                        <span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded">${seller.rating}</span>
                                    </div>
                                    <a href="${whatsappLink}" target="_blank" class="mt-3 w-full bg-[#25D366] hover:bg-[#20ba5a] text-white py-2.5 px-4 rounded-md font-bold text-xs flex items-center justify-center space-x-2 shadow-sm transition">
                                        <i class="fa-brands fa-whatsapp text-lg"></i>
                                        <span>Chat with Seller on WhatsApp</span>
                                    </a>
                                </div>
                            </div>

                            <div class="mt-8 flex space-x-4">
                                <button onclick="addToCart(${p.id}); openCart();" class="flex-1 bg-[#ff9f00] hover:bg-[#f39700] text-white py-3.5 rounded font-bold uppercase tracking-wider shadow transition">
                                    <i class="fa-solid fa-cart-shopping mr-2"></i> Add to Cart
                                </button>
                                <button onclick="addToCart(${p.id}); startCheckout();" class="flex-1 bg-[#fb641b] hover:bg-[#e95a12] text-white py-3.5 rounded font-bold uppercase tracking-wider shadow transition">
                                    <i class="fa-solid fa-bolt mr-2"></i> Buy Now
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 3. 地址填写 ---
        function startCheckout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            closeCart();
            switchView('checkout');
        }

        function renderCheckoutHTML() {
            return `
                <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-sm border p-6 sm:p-8">
                    <h2 class="text-xl font-black text-gray-900 mb-6 flex items-center">
                        <i class="fa-solid fa-truck-fast text-[#2874f0] mr-2"></i> Step 1: Delivery Address & Phone
                    </h2>
                    <form onsubmit="saveShipping(event)" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-600 mb-1">Full Name</label>
                                <input type="text" id="ship-name" required placeholder="Aarav Sharma" class="w-full border p-2.5 rounded text-sm focus:outline-blue-600">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-600 mb-1">WhatsApp / Phone (+91)</label>
                                <input type="tel" id="ship-phone" required placeholder="9876543210" class="w-full border p-2.5 rounded text-sm focus:outline-blue-600">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">Street Address</label>
                            <input type="text" id="ship-address" required placeholder="Flat No, Building, Street Name" class="w-full border p-2.5 rounded text-sm focus:outline-blue-600">
                        </div>
                        <div class="grid grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-600 mb-1">City</label>
                                <input type="text" id="ship-city" required placeholder="Mumbai / Delhi" class="w-full border p-2.5 rounded text-sm focus:outline-blue-600">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-600 mb-1">State</label>
                                <input type="text" id="ship-state" required placeholder="Maharashtra" class="w-full border p-2.5 rounded text-sm focus:outline-blue-600">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-600 mb-1">Pincode</label>
                                <input type="text" id="ship-pincode" required placeholder="400001" class="w-full border p-2.5 rounded text-sm focus:outline-blue-600">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-[#fb641b] hover:bg-[#e95a12] text-white py-3 rounded font-bold uppercase tracking-wider mt-6 shadow">
                            Proceed to Payment <i class="fa-solid fa-arrow-right ml-2"></i>
                        </button>
                    </form>
                </div>
            `;
        }

        function saveShipping(e) {
            e.preventDefault();
            shippingInfo = {
                name: document.getElementById('ship-name').value,
                phone: document.getElementById('ship-phone').value,
                address: document.getElementById('ship-address').value,
                city: document.getElementById('ship-city').value,
                state: document.getElementById('ship-state').value,
                pincode: document.getElementById('ship-pincode').value
            };
            switchView('payment');
        }

        // --- 4. 原版印度支付页面 (PhonePe, GPay, Paytm, Bank Cards - 无 COD) ---
        function renderPaymentHTML() {
            const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            return `
                <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-sm border p-6 sm:p-8">
                    <h2 class="text-xl font-black text-gray-900 mb-6 flex items-center">
                        <i class="fa-solid fa-shield-halved text-[#2874f0] mr-2"></i> Step 2: Indian Online Payment Gateway
                    </h2>
                    
                    <div class="space-y-4 mb-6">
                        <!-- PhonePe -->
                        <label class="flex items-center p-4 border rounded-lg cursor-pointer hover:bg-gray-50 border-purple-200 bg-purple-50/20">
                            <input type="radio" name="payment" checked class="h-4 w-4 text-purple-600" onchange="togglePaymentInput('phonepe')">
                            <div class="ml-3 flex items-center justify-between w-full">
                                <div>
                                    <span class="block font-bold text-sm text-purple-900">PhonePe UPI</span>
                                    <span class="text-xs text-gray-500">Pay directly via PhonePe handle (@ybl)</span>
                                </div>
                                <span class="bg-purple-100 text-purple-700 text-[10px] font-bold px-2 py-1 rounded">Popular</span>
                            </div>
                        </label>

                        <!-- Google Pay (GPay) -->
                        <label class="flex items-center p-4 border rounded-lg cursor-pointer hover:bg-gray-50 border-blue-200 bg-blue-50/20">
                            <input type="radio" name="payment" class="h-4 w-4 text-blue-600" onchange="togglePaymentInput('gpay')">
                            <div class="ml-3">
                                <span class="block font-bold text-sm text-blue-900">Google Pay (GPay)</span>
                                <span class="text-xs text-gray-500">Fast UPI secure transfer (@oksbi / @okaxis)</span>
                            </div>
                        </label>

                        <!-- Paytm UPI & Wallet -->
                        <label class="flex items-center p-4 border rounded-lg cursor-pointer hover:bg-gray-50 border-sky-200 bg-sky-50/20">
                            <input type="radio" name="payment" class="h-4 w-4 text-sky-600" onchange="togglePaymentInput('paytm')">
                            <div class="ml-3">
                                <span class="block font-bold text-sm text-sky-900">Paytm UPI & Wallet</span>
                                <span class="text-xs text-gray-500">Instant payment via Paytm secure gateway</span>
                            </div>
                        </label>

                        <!-- Credit / Debit / ATM Card -->
                        <label class="flex items-center p-4 border rounded-lg cursor-pointer hover:bg-gray-50">
                            <input type="radio" name="payment" class="h-4 w-4 text-blue-600" onchange="togglePaymentInput('card')">
                            <div class="ml-3">
                                <span class="block font-bold text-sm">Credit / Debit / ATM Card</span>
                                <span class="text-xs text-gray-500">Visa, MasterCard, RuPay (All Indian Banks)</span>
                            </div>
                        </label>
                    </div>

                    <!-- 动态输入框 -->
                    <div id="payment-input-container" class="mb-6 p-4 bg-gray-50 rounded border">
                        <label id="payment-label" class="block text-xs font-bold text-gray-700 mb-1">Enter PhonePe UPI ID / Number</label>
                        <input type="text" id="payment-detail-input" placeholder="9876543210@ybl" class="w-full border p-2.5 rounded text-sm bg-white focus:outline-blue-600">
                    </div>

                    <div class="bg-gray-100 p-4 rounded mb-6 flex justify-between items-center">
                        <span class="font-bold text-sm">Total Payable Amount:</span>
                        <span class="text-xl font-black text-[#2874f0]">₹${subtotal}</span>
                    </div>

                    <button onclick="completeOrder()" class="w-full bg-[#388e3c] hover:bg-[#327a34] text-white py-3.5 rounded font-bold uppercase tracking-wider shadow">
                        Pay ₹${subtotal} Securely Now
                    </button>
                </div>
            `;
        }

        function togglePaymentInput(type) {
            const container = document.getElementById('payment-input-container');
            const label = document.getElementById('payment-label');
            const input = document.getElementById('payment-detail-input');
            
            container.style.display = 'block';
            if (type === 'phonepe') {
                label.innerText = "Enter PhonePe UPI ID / Number";
                input.placeholder = "9876543210@ybl";
            } else if (type === 'gpay') {
                label.innerText = "Enter Google Pay UPI ID";
                input.placeholder = "username@oksbi";
            } else if (type === 'paytm') {
                label.innerText = "Enter Paytm Registered Mobile / UPI";
                input.placeholder = "+91 9876543210 or number@paytm";
            } else if (type === 'card') {
                label.innerText = "Card Number / Expiry (MM/YY) / CVV";
                input.placeholder = "4532 XXXX XXXX XXXX | 12/28 | 321";
            }
        }

        function completeOrder() {
            cart = [];
            document.getElementById('cart-badge').innerText = '0';
            switchView('success');
        }

        // --- 5. 成功页面 ---
        function renderSuccessHTML() {
            return `
                <div class="max-w-xl mx-auto bg-white rounded-lg shadow-sm border p-8 text-center">
                    <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <h2 class="text-2xl font-black text-gray-900 mb-2">Payment Authorized Successfully!</h2>
                    <p class="text-gray-600 text-sm mb-6">Your payment has been securely processed via Indian Payment Gateway (PhonePe/GPay/Paytm/Card). Order dispatched for express delivery to <strong>${shippingInfo.city || 'your city'}</strong>.</p>
                    <div class="bg-gray-50 p-4 rounded text-xs text-gray-500 mb-6 text-left">
                        <p><strong>Receiver:</strong> ${shippingInfo.name} (+91 ${shippingInfo.phone})</p>
                        <p><strong>Address:</strong> ${shippingInfo.address}, ${shippingInfo.city}, ${shippingInfo.state} - ${shippingInfo.pincode}</p>
                    </div>
                    <button onclick="switchView('home')" class="bg-[#2874f0] text-white px-8 py-3 rounded font-bold text-xs uppercase tracking-wider shadow">
                        Continue Shopping
                    </button>
                </div>
            `;
        }

        function filterCategory(cat) {
            displayCount = 24;
            if (cat === 'All') filteredProducts = allProducts;
            else filteredProducts = allProducts.filter(p => p.category === cat);
            switchView('home');
        }

        function handleSearch(kw) {
            displayCount = 24;
            const q = kw.toLowerCase();
            filteredProducts = allProducts.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
            if (currentView !== 'home') switchView('home');
            else render();
        }

        function loadMore() {
            displayCount += 24;
            render();
        }

        function addToCart(id) {
            const p = allProducts.find(item => item.id === id);
            const item = cart.find(i => i.id === id);
            if (item) item.qty++;
            else cart.push({ ...p, qty: 1 });
            document.getElementById('cart-badge').innerText = cart.reduce((s, i) => s + i.qty, 0);
            openCart();
            renderCart();
        }

        function openCart() { document.getElementById('cart-drawer').classList.remove('hidden'); renderCart(); }
        function closeCart() { document.getElementById('cart-drawer').classList.add('hidden'); }

        function renderCart() {
            const body = document.getElementById('cart-body');
            const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            body.innerHTML = cart.length === 0 ? '<div class="text-center text-gray-400 py-20 font-bold">Your Flipkart Cart is empty!</div>' : `
                ${cart.map(i => `
                    <div class="flex justify-between items-center border-b pb-3">
                        <div class="pr-2">
                            <h4 class="font-bold text-sm text-gray-800 line-clamp-1">${i.name}</h4>
                            <p class="text-xs text-gray-500">₹${i.price} ×${i.qty}</p>
                        </div>
                        <span class="font-bold text-sm whitespace-nowrap">₹${i.price * i.qty}</span>
                    </div>
                `).join('')}
                <div class="border-t pt-4 font-bold text-lg flex justify-between items-center">
                    <span>Total Amount:</span>
                    <span class="text-[#2874f0]">₹${subtotal}</span>
                </div>
                <button onclick="startCheckout()" class="w-full bg-[#ff9f00] text-white py-3 rounded-sm font-bold uppercase tracking-wider mt-4 shadow hover:bg-[#f39700] transition">Proceed to Checkout</button>
            `;
        }

        init();
    </script>
</body>
</html>
